# ============================================================================
#  OnyxZygisk — 修正版 verify.yml（备选）
# ----------------------------------------------------------------------------
#  与原版的区别（仅三处，专为「能手动运行 + 不报无关错误」而改）：
#    1. 加了 workflow_dispatch            → Actions 页面出现 "Run workflow" 按钮
#    2. setup-rust-toolchain 加 cache:false → 修掉 "找不到根目录 Cargo.toml" 的
#       rust-cache 报错（该错非致命但会污染日志）
#    3. gradle 构建加 --stacktrace         → 若仍失败，能直接看到 cargo 真实报错
#
#  如果你就是想保留「验证 + 构建」一体，用这个；否则用 build.yml 更干净。
# ============================================================================

name: Verify

on:
  push:
  pull_request:
  # 手动触发按钮：允许在 Actions 页面点击 "Run workflow"
  workflow_dispatch:

jobs:
  zygote-jni:
    name: Zygote JNI hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Nubia JNI signatures and generated hooks
        run: python3 loader/src/injector/test_jni_hooks.py

  zigcore:
    name: Zig core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Run Zig tests
        working-directory: loader/zigcore
        run: zig build test --summary all

  webui:
    name: WebUI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: zygiskd/webui/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: zygiskd/webui
        run: pnpm install --frozen-lockfile
      - name: Format and lint
        working-directory: zygiskd/webui
        run: pnpm check:biome
      - name: Type-check
        working-directory: zygiskd/webui
        run: pnpm type-check
      - name: Build
        working-directory: zygiskd/webui
        run: pnpm build
      - name: Unit guards
        working-directory: zygiskd/webui
        run: pnpm test
      - name: Install Playwright browsers
        working-directory: zygiskd/webui
        run: pnpm exec playwright install --with-deps chromium
      - name: Behaviour and accessibility
        working-directory: zygiskd/webui
        run: pnpm test:e2e

  android:
    name: Android release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Install Android toolchain
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0
          target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          # 修正：关掉默认缓存，避免 rust-cache 在根目录找不到 Cargo.toml 报错
          cache: false
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: zygiskd/webui/pnpm-lock.yaml
      - name: Build release module
        env:
          RUSTFLAGS: ""
        run: bash ./gradlew :module:zipRelease --no-daemon --console=plain --stacktrace
      - name: Upload module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: onyxzygisk-release
          path: module/build/outputs/release/*.zip
          if-no-files-found: error
